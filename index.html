<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --surface-color: #111111;
            --surface-hover: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .sidebar-top { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 80px); padding-right: 4px; }
        .brand-header { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; padding: 4px 8px; color: #fff; }
        .brand-logo-icon { width: 28px; height: 28px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #2a2a2a; }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 8px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 9px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; text-align: left; width: 100%; transition: 0.2s; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: #222; color: #fff; border: 1px solid #444; }

        .deep-search-box { background: rgba(255, 255, 255, 0.04); border: 1px solid #333; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .deep-search-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #fff; font-weight: 500; }
        .toggle-switch { position: relative; width: 36px; height: 20px; background-color: #333; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .toggle-switch::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background-color: white; top: 2px; left: 2px; transition: 0.3s; }
        input.deep-checkbox { display: none; }
        input.deep-checkbox:checked + .toggle-switch { background-color: #fff; }
        input.deep-checkbox:checked + .toggle-switch::after { transform: translateX(16px); background-color: #000; }

        .user-profile-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background-color: var(--surface-hover); border: 1px solid var(--border-color); cursor: pointer; }
        .user-avatar { width: 32px; height: 32px; background-color: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
        .user-info { font-size: 13px; color: var(--text-primary); }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 10; }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: #fff; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }

        /* Welcome Entrance Screen */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .welcome-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .title-left { font-size: 64px; font-weight: 700; letter-spacing: 4px; color: #ffffff; }
        .title-right { font-size: 64px; font-weight: 700; letter-spacing: 4px; color: #ffffff; }

        /* Classic White V with 8 Dots Circling It */
        .orbit-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-center-v {
            width: 54px;
            height: 54px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 2;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: spinOrbit 4s linear infinite;
        }

        .dot { position: absolute; width: 7px; height: 7px; background-color: #ffffff; border-radius: 50%; box-shadow: 0 0 8px #ffffff; }
        .d1 { top: 2px; left: 51px; }
        .d2 { top: 16px; left: 83px; }
        .d3 { top: 51px; left: 101px; }
        .d4 { top: 85px; left: 83px; }
        .d5 { top: 100px; left: 51px; }
        .d6 { top: 85px; left: 18px; }
        .d7 { top: 51px; left: 0px; }
        .d8 { top: 16px; left: 18px; }

        @keyframes spinOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .start-chat-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .start-chat-btn:hover { background: #e0e0e0; transform: scale(1.04); }

        .version-label { font-size: 11px; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px; }

        .white-flash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: none;
            z-index: 30;
        }

        .chat-container-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            display: none;
            flex-direction: column;
            z-index: 5;
        }
        .chat-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; scroll-behavior: smooth; z-index: 3; }
        
        .center-greeting-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            gap: 12px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 500;
            min-height: 50vh;
        }

        .message { display: flex; gap: 14px; max-width: 100%; }
        .message.user { flex-direction: row-reverse; align-self: flex-end; }
        .message.ai { justify-content: flex-start; align-self: flex-start; width: 100%; }
        
        .message-avatar { width: 32px; height: 32px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
        .message.ai .message-content { color: var(--text-primary); font-size: 15px; line-height: 1.6; width: 100%; word-break: break-word; }
        .message.user .message-content { background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 18px 18px 4px 18px; font-size: 15px; word-break: break-word; }

        .deep-search-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #444; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; font-weight: 600; }

        .input-area { padding: 16px 24px 20px 24px; max-width: 950px; width: 100%; margin: 0 auto; z-index: 3; flex-shrink: 0; }
        .input-box-wrapper { background-color: #111111; border-radius: 28px; padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #activeInput { background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; width: 100%; min-height: 24px; max-height: 120px; }
        
        .send-btn { background-color: #fff; color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; flex-shrink: 0; }
        .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
        footer { text-align: center; padding: 4px; color: var(--text-secondary); font-size: 11px; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo-icon">V</div>
                <span>Vikea AI</span>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>

            <div class="sidebar-section-title">Extensions</div>
            <div class="sidebar-nav">
                <button class="nav-item" onclick="openPluginsModal()">
                    <span class="material-symbols-outlined">extension</span>
                    Plugins
                </button>
            </div>

            <div class="sidebar-section-title">Advanced Settings</div>
            <div class="deep-search-box">
                <div class="deep-search-info">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: #fff;">travel_explore</span>
                    <span>Deep Search Mode</span>
                </div>
                <label style="display:flex; align-items:center; cursor:pointer;">
                    <input type="checkbox" id="deepSearchCheckbox" class="deep-checkbox">
                    <div class="toggle-switch"></div>
                </label>
            </div>

            <div class="sidebar-section-title">Engine & Moods</div>
            <div class="sidebar-nav">
                <button class="nav-item active-mode" id="navUniversal" onclick="switchEngineMode('universal')">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Multi-Universal Core
                </button>
                <button class="nav-item" id="navCells" onclick="switchEngineMode('cells')">
                    <span class="material-symbols-outlined">biotech</span>
                    GCSE Cell Biology
                </button>
                <button class="nav-item" id="navPeriodic" onclick="switchEngineMode('periodic')">
                    <span class="material-symbols-outlined">science</span>
                    AQA Periodic Table & Atoms
                </button>
                <button class="nav-item" id="navCoder" onclick="switchEngineMode('coder')">
                    <span class="material-symbols-outlined">terminal</span>
                    Elite Coder Mode
                </button>
                <button class="nav-item" id="navRoast" onclick="switchEngineMode('roast')">
                    <span class="material-symbols-outlined">local_fire_department</span>
                    Savage Roast Mode 🔥
                </button>
                <button class="nav-item" id="navPhilosopher" onclick="switchEngineMode('philosopher')">
                    <span class="material-symbols-outlined">psychology</span>
                    Deep Philosopher
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row" onclick="changeUserName()" title="Click to change name">
                <div class="user-avatar" id="userAvatarLetter">W</div>
                <div class="user-info" id="userNameLabel">Wahaj</div>
            </div>
        </div>
    </aside>

    <div class="main-container">
        <header>
            <span id="headerTitle">Vikea AI Assistant</span>
            <div class="model-badge-header" id="modelBadgeHeader">
                <span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">bolt</span>
                Universal Engine Active
            </div>
        </header>

        <!-- Welcome Entrance Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div></div>
            <div class="welcome-content">
                <span class="title-left">VIKEA</span>
                <div class="orbit-container" id="welcomeOrbit">
                    <div class="orbit-ring" id="welcomeRing">
                        <div class="dot d1"></div>
                        <div class="dot d2"></div>
                        <div class="dot d3"></div>
                        <div class="dot d4"></div>
                        <div class="dot d5"></div>
                        <div class="dot d6"></div>
                        <div class="dot d7"></div>
                        <div class="dot d8"></div>
                    </div>
                    <div class="orbit-center-v">V</div>
                </div>
                <span class="title-right">AI</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
                <button class="start-chat-btn" onclick="startChatTransition()">Get Started / Chat</button>
                <div class="version-label">Version Alpha • Vikea Engine</div>
            </div>
        </div>

        <!-- White Flash Transition Screen -->
        <div class="white-flash-screen" id="whiteFlashScreen"></div>

        <!-- Chat Screen Background -->
        <div class="chat-container-bg" id="chatContainerBg">
            <div class="chat-overlay">
                <div class="chat-stream" id="chatStream">
                    <!-- Middle Greeting Box -->
                    <div class="center-greeting-box" id="centerGreetingBox">
                        <h1>How can I help u</h1>
                    </div>
                </div>
                <div class="input-area" id="activeInputArea">
                    <div class="input-box-wrapper">
                        <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" onkeydown="handleKey(event)"></textarea>
                        <div class="prompt-toolbar" style="display:flex; justify-content:flex-end; border:none; padding-top:0;">
                            <button class="send-btn" onclick="sendFromActiveArea()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                    <footer>Made with Vikea Multi-Universal Engine © 2026</footer>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserName = "Wahaj";
        let currentMode = "universal";

        function changeUserName() {
            const newName = prompt("Enter your new name:", currentUserName);
            if (newName && newName.trim() !== "") {
                currentUserName = newName.trim();
                document.getElementById('userNameLabel').innerText = currentUserName;
                document.getElementById('userAvatarLetter').innerText = currentUserName.charAt(0).toUpperCase();
            }
        }

        function openPluginsModal() {
            if (document.getElementById('welcomeScreen').style.display !== 'none') {
                startChatTransition();
                setTimeout(() => { alert("Plugins Manager: Connected to Vikea Plugin Ecosystem successfully!"); }, 5200);
            } else {
                alert("Plugins Manager: Connected to Vikea Plugin Ecosystem successfully!");
            }
        }

        function startChatTransition() {
            const welcome = document.getElementById('welcomeScreen');
            const ring = document.getElementById('welcomeRing');
            const flash = document.getElementById('whiteFlashScreen');
            
            if (welcome.style.display !== 'none') {
                ring.style.animation = 'spinOrbit 0.25s cubic-bezier(0.5, 0, 0.5, 1) infinite';

                setTimeout(() => {
                    flash.style.display = 'block';
                    setTimeout(() => {
                        welcome.style.display = 'none';
                        flash.style.display = 'none';
                        document.getElementById('chatContainerBg').style.display = 'flex';
                        document.getElementById('activeInput').focus();
                    }, 400); 
                }, 5000);
            }
        }

        function switchEngineMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-mode'));
            
            if (document.getElementById('welcomeScreen').style.display !== 'none') {
                startChatTransition();
            }
            
            const badge = document.getElementById('modelBadgeHeader');
            const greetingBox = document.getElementById('centerGreetingBox');
            if (greetingBox) greetingBox.remove(); 

            const stream = document.getElementById('chatStream');
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';

            if (mode === 'universal') {
                document.getElementById('navUniversal').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">bolt</span> Universal Engine Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Switched to <strong>Multi-Universal Core</strong>. Ready for anything!</div>`;
            } else if (mode === 'cells') {
                document.getElementById('navCells').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">biotech</span> GCSE Cell Biology Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Switched to <strong>GCSE Cell Biology</strong> mode. Hit me with organelle questions!</div>`;
            } else if (mode === 'periodic') {
                document.getElementById('navPeriodic').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">science</span> AQA Periodic Table Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Switched to <strong>AQA Periodic Table & Atoms</strong> mode. Let's study chemistry!</div>`;
            } else if (mode === 'coder') {
                document.getElementById('navCoder').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">terminal</span> Elite Coder Mode Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Elite Coder mode online. Let's write clean code.</div>`;
            } else if (mode === 'roast') {
                document.getElementById('navRoast').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">local_fire_department</span> Savage Roast Mode Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Roast mode active. Don't cry when I cook you, ${currentUserName}. What's up?</div>`;
            } else if (mode === 'philosopher') {
                document.getElementById('navPhilosopher').classList.add('active-mode');
                badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">psychology</span> Deep Philosopher Active`;
                aiMsgDiv.innerHTML = `<div class="message-avatar">V</div><div class="message-content">Welcome to Deep Philosopher mode. Let us contemplate the universe.</div>`;
            }
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendFromActiveArea();
            }
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text) return;
            
            const greetingBox = document.getElementById('centerGreetingBox');
            if (greetingBox) greetingBox.remove();

            input.value = '';
            processUserQuery(text);
        }

        async function processUserQuery(query) {
            const stream = document.getElementById('chatStream');
            const userInitial = currentUserName.charAt(0).toUpperCase();
            const isDeepSearchOn = document.getElementById('deepSearchCheckbox').checked;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-avatar">${userInitial}</div><div class="message-content">${escapeHtml(query)}</div>`;
            stream.appendChild(userMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            if (isDeepSearchOn) {
                const searchingDiv = document.createElement('div');
                searchingDiv.className = 'message ai';
                searchingDiv.id = 'searchIndicator';
                searchingDiv.innerHTML = `
                    <div class="message-avatar">V</div>
                    <div class="message-content" style="color: var(--text-secondary); display:flex; align-items:center; gap:8px;">
                        <span class="material-symbols-outlined" style="animation: spin 1.5s linear infinite; font-size: 18px;">progress_activity</span>
                        Performing Deep Search across database...
                    </div>
                `;
                stream.appendChild(searchingDiv);
                stream.scrollTop = stream.scrollHeight;
                await new Promise(r => setTimeout(r, 1400));
                document.getElementById('searchIndicator').remove();
            } else {
                await new Promise(r => setTimeout(r, 500));
            }

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            
            let responseText = generateSmartResponse(currentMode, query);
            let deepSearchHTML = isDeepSearchOn ? `<div class="deep-search-tag"><span class="material-symbols-outlined" style="font-size: 13px;">travel_explore</span> Deep Search Verified</div><br>` : '';

            aiMsgDiv.innerHTML = `
                <div class="message-avatar">V</div>
                <div class="message-content">${deepSearchHTML}${responseText}</div>
            `;
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        function generateSmartResponse(mode, query) {
            const q = query.toLowerCase();
            
            if (mode === 'cells') {
                if (q.includes('ribosome')) return "Ribosomes are tiny structures responsible for **protein synthesis**.";
                return `Regarding **"${escapeHtml(query)}"** in GCSE Cell Biology: Cells use organelles to maintain specialized life processes.`;
            } 
            else if (mode === 'periodic') {
                if (q.includes('halogen')) return "Group 7 elements (halogens) show a decrease in reactivity down the group.";
                return `Under AQA Chemistry rules regarding **"${escapeHtml(query)}"**, atoms bond to achieve full outer electron shells.`;
            }
            else if (mode === 'coder') {
                return `Here is the coding breakdown for <strong>"${escapeHtml(query)}"</strong>: Make sure your logic handles edge cases and uses clean modular structures.`;
            }
            else if (mode === 'roast') {
                return `Bro really asked <strong>"${escapeHtml(query)}"</strong> expecting me to do all the heavy lifting while you sit there. Classic ${currentUserName} behavior. 🔥`;
            }
            else if (mode === 'philosopher') {
                return `To ponder <strong>"${escapeHtml(query)}"</strong> is to gaze into the very nature of existence. What is knowledge if not an endless pursuit of truth?`;
            }
            else {
                return `Processed your request regarding <strong>"${escapeHtml(query)}"</strong> with Vikea Alpha. What would you like to explore next?`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
