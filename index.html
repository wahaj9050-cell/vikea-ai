<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI - GCSE Science & Universal Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #0a0a0a;
            --surface-color: #121212;
            --surface-hover: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #262626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-top { display: flex; flex-direction: column; gap: 16px; }
        .brand-header { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; padding: 4px 8px; color: #fff; }
        .brand-logo-icon { width: 28px; height: 28px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #fff; background: none; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #333; }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 12px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; transition: 0.2s; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: #262626; color: #fff; border: 1px solid #404040; }

        .user-profile-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background-color: var(--surface-hover); border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .user-profile-row:hover { border-color: #fff; }
        .user-avatar { width: 32px; height: 32px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; background: none; }
        .user-info { font-size: 13px; color: var(--text-primary); }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: #fff; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); }

        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
        
        .welcome-vibe-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 32px; }
        
        .animation-stage { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
        .center-v { position: absolute; font-size: 26px; font-weight: 700; color: #ffffff; font-family: 'Google Sans', sans-serif; z-index: 2; user-select: none; background: none; border: none; }
        #animCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        .welcome-title-vibe { font-size: 38px; font-weight: 500; color: #fff; text-align: center; letter-spacing: -0.5px; }
        .glow-border-wrapper { position: relative; width: 100%; max-width: 720px; border-radius: 28px; padding: 1px; background: #333; border: 1px solid var(--border-color); }
        .centered-prompt-box { background-color: var(--surface-color); border-radius: 27px; padding: 14px 18px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        
        .centered-textarea { background: none; border: none; color: var(--text-primary); font-size: 16px; resize: none; outline: none; width: 100%; min-height: 24px; max-height: 120px; line-height: 1.5; }
        
        .prompt-toolbar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .toolbar-left { display: flex; gap: 8px; align-items: center; }
        
        .deep-search-chip { display: flex; align-items: center; gap: 6px; background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; transition: 0.2s; }
        .deep-search-chip:hover { border-color: #fff; color: var(--text-primary); }
        .deep-search-chip.active { background-color: #fff; border-color: #fff; color: #000; font-weight: 500; }

        .message { display: flex; gap: 14px; max-width: 100%; }
        .message.user { flex-direction: row-reverse; align-self: flex-end; }
        .message.ai { justify-content: flex-start; align-self: flex-start; width: 100%; }
        
        .message-avatar { width: 32px; height: 32px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; background: none; color: #fff; flex-shrink: 0; }
        
        .message.ai .message-content { color: var(--text-primary); font-size: 15px; line-height: 1.6; width: 100%; word-break: break-word; }
        .message.user .message-content { background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 18px 18px 4px 18px; font-size: 15px; word-break: break-word; }

        .thinking-stage { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none; }
        .thinking-canvas { position: absolute; top: 0; left: 0; width: 36px; height: 36px; pointer-events: none; }
        .thinking-v { position: absolute; font-size: 12px; font-weight: 700; color: #fff; background: none; }
        
        .deep-thought-box { background: #0a0a0a; border-left: 3px solid #fff; padding: 12px 16px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; font-family: monospace; border: 1px solid var(--border-color); line-height: 1.5; }
        
        pre { background-color: #0d0d0d; border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: monospace; font-size: 13.5px; color: #e0e0e0; }

        .input-area { padding: 12px 24px 16px 24px; max-width: 950px; width: 100%; margin: 0 auto; background-color: var(--bg-color); }
        .input-box-wrapper { background-color: var(--surface-color); border-radius: 28px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); }
        #activeInput { background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; width: 100%; min-height: 24px; }
        
        .send-btn { background-color: #fff; color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
        footer { text-align: center; padding: 6px; color: var(--text-secondary); font-size: 12px; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo-icon">V</div>
                <span>Vikea AI</span>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>
            <div class="sidebar-section-title">Engine Mode</div>
            <div class="sidebar-nav">
                <button class="nav-item active-mode" id="navUniversal" onclick="switchEngineMode('universal')">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Multi-Universal Core
                </button>
                <button class="nav-item" id="navDeepSearch" onclick="switchEngineMode('deepsearch')">
                    <span class="material-symbols-outlined">globe_asia</span>
                    Deep Search Mode
                </button>
                <button class="nav-item" id="navCells" onclick="switchEngineMode('cells')">
                    <span class="material-symbols-outlined">biotech</span>
                    GCSE Cell Biology
                </button>
                <button class="nav-item" id="navPeriodic" onclick="switchEngineMode('periodic')">
                    <span class="material-symbols-outlined">science</span>
                    AQA Periodic Table & Atoms
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row" onclick="changeUserName()" title="Click to change name">
                <div class="user-avatar" id="userAvatarLetter">W</div>
                <div class="user-info" id="userNameLabel">Wahaj</div>
            </div>
        </div>
    </aside>

    <div class="main-container">
        <header>
            <span id="headerTitle">Vikea AI Assistant</span>
            <div class="model-badge-header" id="modelBadgeHeader">Universal Engine Active</div>
        </header>

        <div class="chat-stream" id="chatStream">
            <div class="welcome-vibe-container" id="vibeWelcomeScreen">
                <div class="animation-stage" id="welcomeAnimStage">
                    <div class="center-v" id="welcomeVText">V</div>
                    <canvas id="animCanvas" width="130" height="130"></canvas>
                </div>
                <div class="welcome-title-vibe" id="vibeTitleText">What's the vibe, Wahaj?</div>
                
                <div class="glow-border-wrapper">
                    <div class="centered-prompt-box">
                        <textarea class="centered-textarea" id="vibeInput" placeholder="Ask about photosynthesis, live weather in any city, or GCSE formulas..." rows="2" onkeydown="handleKey(event, 'vibe')"></textarea>
                        <div class="prompt-toolbar">
                            <div class="toolbar-left">
                                <div class="deep-search-chip" id="vibeDeepSearchChip" onclick="toggleDeepSearchFromChip()">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">globe_asia</span>
                                    <span id="vibeDeepSearchText">Universal Search: Off</span>
                                </div>
                            </div>
                            <button class="send-btn" onclick="sendFromVibeScreen()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area" id="activeInputArea" style="display: none;">
            <div class="input-box-wrapper">
                <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" onkeydown="handleKey(event, 'active')"></textarea>
                <div class="prompt-toolbar" style="border:none; padding-top:0;">
                    <div class="toolbar-left">
                        <div class="deep-search-chip" id="activeDeepSearchChip" onclick="toggleDeepSearchFromChip()">
                            <span class="material-symbols-outlined" style="font-size: 16px;">globe_asia</span>
                            <span id="activeDeepSearchText">Universal Search: Off</span>
                        </div>
                    </div>
                    <button class="send-btn" onclick="sendFromActiveArea()">
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                    </button>
                </div>
            </div>
            <footer>Made with Vikea Multi-Universal Engine © 2026</footer>
        </div>
    </div>

    <script>
        let currentUserName = "Wahaj";
        let deepSearchEnabled = false;

        function changeUserName() {
            const newName = prompt("Enter your new name:", currentUserName);
            if (newName && newName.trim() !== "") {
                currentUserName = newName.trim();
                document.getElementById('userNameLabel').innerText = currentUserName;
                document.getElementById('userAvatarLetter').innerText = currentUserName.charAt(0).toUpperCase();
                const vibeTitle = document.getElementById('vibeTitleText');
                if (vibeTitle) vibeTitle.innerText = `What's the vibe, ${currentUserName}?`;
            }
        }

        function switchEngineMode(mode) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-mode'));
            if (mode === 'universal') {
                document.getElementById('navUniversal').classList.add('active-mode');
                deepSearchEnabled = false;
                updateSearchChipsUI();
                document.getElementById('modelBadgeHeader').innerText = "Universal Engine Active";
            } else if (mode === 'deepsearch') {
                document.getElementById('navDeepSearch').classList.add('active-mode');
                deepSearchEnabled = true;
                updateSearchChipsUI();
                document.getElementById('modelBadgeHeader').innerText = "Deep Search Mode Active 🌐";
            } else if (mode === 'cells') {
                document.getElementById('navCells').classList.add('active-mode');
                triggerModeQuery("cells and specialized cells");
            } else if (mode === 'periodic') {
                document.getElementById('navPeriodic').classList.add('active-mode');
                triggerModeQuery("periodic table");
            }
        }

        function triggerModeQuery(queryText) {
            const welcome = document.getElementById('vibeWelcomeScreen');
            if(welcome) welcome.remove();
            document.getElementById('activeInputArea').style.display = 'block';
            processUserQuery(queryText);
        }

        function toggleDeepSearchFromChip() {
            deepSearchEnabled = !deepSearchEnabled;
            updateSearchChipsUI();
            if (deepSearchEnabled) {
                document.getElementById('navDeepSearch').classList.add('active-mode');
                document.getElementById('navUniversal').classList.remove('active-mode');
                document.getElementById('modelBadgeHeader').innerText = "Deep Search Mode Active 🌐";
            } else {
                document.getElementById('navUniversal').classList.add('active-mode');
                document.getElementById('navDeepSearch').classList.remove('active-mode');
                document.getElementById('modelBadgeHeader').innerText = "Universal Engine Active";
            }
        }

        function updateSearchChipsUI() {
            const vibeChip = document.getElementById('vibeDeepSearchChip');
            const activeChip = document.getElementById('activeDeepSearchChip');
            const vibeText = document.getElementById('vibeDeepSearchText');
            const activeText = document.getElementById('activeDeepSearchText');

            if (deepSearchEnabled) {
                if(vibeChip) vibeChip.classList.add('active');
                if(activeChip) activeChip.classList.add('active');
                if(vibeText) vibeText.innerText = "Universal Search: On";
                if(activeText) activeText.innerText = "Universal Search: On";
            } else {
                if(vibeChip) vibeChip.classList.remove('active');
                if(activeChip) activeChip.classList.remove('active');
                if(vibeText) vibeText.innerText = "Universal Search: Off";
                if(activeText) activeText.innerText = "Universal Search: Off";
            }
        }

        // Quantum Vortex Welcome Animation
        const canvas = document.getElementById('animCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const centerX = 65, centerY = 65, ringCount = 3, particlesPerRing = 10;
        const qParticles = [];

        for(let r=1; r<=ringCount; r++) {
            for(let i=0; i<particlesPerRing; i++) {
                qParticles.push({
                    ring: r,
                    angle: (i / particlesPerRing) * Math.PI * 2,
                    speed: (r % 2 === 0 ? 0.02 : -0.03) * r,
                    radius: 18 * r,
                    size: 2.2 + r * 0.5
                });
            }
        }

        let animTimer = 0;
        function animateWelcome() {
            if(!ctx) return;
            ctx.clearRect(0, 0, 130, 130);
            animTimer += 0.03;

            qParticles.forEach(p => {
                p.angle += p.speed;
                const currentRad = p.radius + Math.sin(animTimer * 2 + p.ring) * 4;
                const x = centerX + Math.cos(p.angle) * currentRad;
                const y = centerY + Math.sin(p.angle) * currentRad;

                ctx.fillStyle = p.ring === 1 ? '#ffffff' : (p.ring === 2 ? '#aaaaaa' : '#555555');
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animateWelcome);
        }
        if(canvas) requestAnimationFrame(animateWelcome);

        function initQuantumThinkingAnimation(canvasId) {
            const tCanvas = document.getElementById(canvasId);
            if (!tCanvas) return;
            const tCtx = tCanvas.getContext('2d');
            let tTimer = 0;
            const tParts = [];
            for(let i=0; i<8; i++) {
                tParts.push({ angle: (i/8) * Math.PI * 2, dist: 10, speed: 0.05 + i*0.005 });
            }

            function drawQuantumThinking() {
                if(!document.body.contains(tCanvas)) return;
                tCtx.clearRect(0, 0, 36, 36);
                tTimer += 0.05;

                tParts.forEach(tp => {
                    tp.angle += tp.speed;
                    const d = 8 + Math.sin(tTimer * 3 + tp.angle) * 3;
                    const x = 18 + Math.cos(tp.angle) * d;
                    const y = 18 + Math.sin(tp.angle) * d;

                    tCtx.fillStyle = '#ffffff';
                    tCtx.shadowColor = '#fff';
                    tCtx.shadowBlur = 6;
                    tCtx.beginPath();
                    tCtx.arc(x, y, 2, 0, Math.PI * 2);
                    tCtx.fill();
                    tCtx.shadowBlur = 0;
                });
                requestAnimationFrame(drawQuantumThinking);
            }
            requestAnimationFrame(drawQuantumThinking);
        }

        function handleKey(event, origin) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (origin === 'vibe') sendFromVibeScreen();
                else sendFromActiveArea();
            }
        }

        function sendFromVibeScreen() {
            const input = document.getElementById('vibeInput');
            const text = input.value.trim();
            if (!text) return;
            const welcome = document.getElementById('vibeWelcomeScreen');
            if(welcome) welcome.remove();
            document.getElementById('activeInputArea').style.display = 'block';
            processUserQuery(text);
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserQuery(text);
        }

        async function processUserQuery(query) {
            const stream = document.getElementById('chatStream');
            const userInitial = currentUserName.charAt(0).toUpperCase();

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-avatar">${userInitial}</div><div class="message-content">${escapeHtml(query)}</div>`;
            stream.appendChild(userMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            const uniqueId = 'quantumCanvas_' + Date.now();
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.id = 'thinkingBubble';
            thinkingDiv.innerHTML = `
                <div class="thinking-stage">
                    <div class="thinking-v">V</div>
                    <canvas class="thinking-canvas" id="${uniqueId}" width="36" height="36"></canvas>
                </div>
                <div class="message-content" style="display:flex; align-items:center; color: var(--text-secondary); font-size: 14px; margin-left: 8px;">
                    ${deepSearchEnabled ? '🌐 Deep Universal Web Crawling & Neural Processing...' : '⚡ Fetching Live Global Data...'}
                </div>
            `;
            stream.appendChild(thinkingDiv);
            stream.scrollTop = stream.scrollHeight;

            initQuantumThinkingAnimation(uniqueId);

            let answerHtml = "";
            const lowerQ = query.toLowerCase();

            // Check if query is asking for weather
            if (lowerQ.includes('weather')) {
                // Extract city name after "weather in" or "weather for" or default to Bolton/London
                let cityName = "London";
                let match = query.match(/weather\s+(?:in|for|at)\s+([a-zA-Z\s]+)/i);
                if (match && match[1]) {
                    cityName = match[1].trim();
                }
                answerHtml = await fetchLiveWeather(cityName, query, deepSearchEnabled);
            } else {
                // Standard AI / GCSE answers
                await new Promise(r => setTimeout(r, deepSearchEnabled ? 1400 : 700));
                answerHtml = generateUniversalAnswer(query, deepSearchEnabled);
            }

            const bubble = document.getElementById('thinkingBubble');
            if(bubble) bubble.remove();

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `
                <div class="message-avatar">V</div>
                <div class="message-content">${answerHtml}</div>
            `;
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        async function fetchLiveWeather(city, rawQuery, isDeep) {
            let reasoning = isDeep ? `<div class="deep-thought-box">🌐 <strong>Global Satellite Weather Link Active</strong><br>Queried meteorological tracking stations for: <em>"${escapeHtml(rawQuery)}"</em></div>` : "";
            try {
                // 1. Geocode city name to lat/lon using Open-Meteo free geocoding API
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    return reasoning + `Could not locate live weather data for "<strong>${escapeHtml(city)}</strong>". Please check the spelling of the city or country!`;
                }

                const loc = geoData.results[0];
                const lat = loc.latitude;
                const lon = loc.longitude;
                const fullName = `${loc.name}, ${loc.country || ''}`;

                // 2. Fetch real-time weather from Open-Meteo
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`);
                const weatherData = await weatherRes.json();

                const current = weatherData.current;
                const temp = current.temperature_2m;
                const windSpeed = current.wind_speed_10m;
                const conditionText = getWeatherDescription(current.weather_code);

                return reasoning + `* **Location**: ${escapeHtml(fullName)}<br>` +
                                   `* **Condition**: ${conditionText}<br>` +
                                   `* **Temperature**: ${temp}°C<br>` +
                                   `* **Wind Speed**: ${windSpeed} km/h`;

            } catch (err) {
                return reasoning + `⚠️ Error fetching live weather network data. Please try again!`;
            }
        }

        function getWeatherDescription(code) {
            // WMO Weather interpretation codes (Open-Meteo standard)
            const codes = {
                0: "Clear sky ☀️",
                1: "Mainly clear 🌤️",
                2: "Partly cloudy ⛅",
                3: "Overcast / Cloudy ☁️",
                45: "Foggy 🌫️",
                51: "Light drizzle 🌦️",
                61: "Slight rain 🌧️",
                63: "Moderate rain 🌧️",
                71: "Slight snow 🌨️",
                95: "Thunderstorm ⚡"
            };
            return codes[code] || "Clear and comfortable 🌤️";
        }

        function generateUniversalAnswer(q, isDeep) {
            let reasoning = isDeep ? `<div class="deep-thought-box">🌐 <strong>Deep Universal Search Matrix Active</strong><br>Parsed global index clusters and synthesized optimal GCSE AQA science solutions for: <em>"${escapeHtml(q)}"</em></div>` : "";
            let cleanQ = q.trim();
            let lower = cleanQ.toLowerCase();

            if (lower.includes('time') || lower.includes('date')) {
                return reasoning + `The current time is ${new Date().toLocaleTimeString()} on ${new Date().toLocaleDateString()}, ${currentUserName}!`;
            }
            if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) {
                return reasoning + `Hello ${currentUserName}! Ready to ace your GCSE Science and Math exams today?`;
            }
            if (lower.includes('photosynthesis')) {
                return reasoning + `### GCSE AQA Biology: Photosynthesis<br><br>` +
                       `<strong>1. Word Equation:</strong><br>Carbon dioxide + Water $\\rightarrow$ Glucose + Oxygen.<br><br>` +
                       `<strong>2. Balanced Chemical Equation:</strong><br>$$6CO_2 + 6H_2O \\xrightarrow{\\text{light}} C_6H_{12}O_6 + 6O_2$$`;
            }
            if (lower.includes('ohm') || lower.includes('current')) {
                return reasoning + `### GCSE AQA Physics: Ohm's Law<br><br>$$V = I \\times R$$<br>Rearranged for current: $$I = \\frac{V}{R}$$`;
            }
            if (lower.includes('quadratic') || lower.includes('quadrlitic')) {
                return reasoning + `### GCSE Mathematics: Quadratic Formula<br><br>$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$`;
            }
            if (lower.includes('vaccine')) {
                return reasoning + `### GCSE AQA Biology: Vaccines<br><br>Dead or inactive pathogens are introduced to stimulate white blood cells to produce matching antibodies and memory cells.`;
            }

            return reasoning + `I have analyzed your query regarding <strong>"${escapeHtml(q)}"</strong>. As your GCSE Science & Universal Engine, I am fully ready to help you, ${currentUserName}!`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
