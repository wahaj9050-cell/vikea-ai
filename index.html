<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: #f1f1f1;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ENTRANCE OVERLAY --- */
        #entrance-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0b0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .entrance-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .logo-animation-container {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* Moving text elements (Vikea & AI) */
        .moving-text {
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Thinner white spinning circle loader with V logo in middle */
        .spinner-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thin-spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .center-v-logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            z-index: 2;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Enhanced Get Started Button */
        .get-started-btn {
            background: linear-gradient(135deg, #ffffff, #dcdcdc);
            color: #0b0b0c;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .get-started-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #ffffff, #ffffff);
        }

        .loading-percentage {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* --- MAIN APP LAYOUT (Hidden initially) --- */
        #main-app {
            display: none;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background-color: #121214;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b0b0c;
        }
    </style>
</head>
<body>

    <!-- Entrance Screen -->
    <div id="entrance-screen">
        <div class="entrance-content">
            <div class="logo-animation-container">
                <span class="moving-text" id="text-vikea">VIKEA</span>
                
                <div class="spinner-wrapper">
                    <div class="thin-spinner" id="loader-spinner"></div>
                    <div class="center-v-logo">V</div>
                </div>

                <span class="moving-text" id="text-ai">AI</span>
            </div>

            <div class="loading-percentage" id="load-counter">Loading... 0%</div>

            <button class="get-started-btn" id="start-btn">Get Started / Chat</button>
        </div>
    </div>

    <!-- Main App (Revealed after clicking) -->
    <div id="main-app" style="display: none;">
        <div class="sidebar">
            <h3>Vikea AI Alpha</h3>
            <p style="color: #666; font-size: 0.85rem;">Sidebar loaded successfully.</p>
        </div>
        <div class="chat-area">
            <div style="padding: 20px;">
                <h2>Welcome to Vikea Chat</h2>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const entranceScreen = document.getElementById('entrance-screen');
        const mainApp = document.getElementById('main-app');
        
        const textVikea = document.getElementById('text-vikea');
        const textAi = document.getElementById('text-ai');
        const spinner = document.getElementById('loader-spinner');
        const loadCounter = document.getElementById('load-counter');

        let currentPercent = 0;

        // Simulate dynamic faster-and-faster loading progress
        function startLoadingSequence() {
            let speed = 50; // starts at 50ms interval increments
            
            let interval = setInterval(() => {
                currentPercent += Math.floor(Math.random() * 4) + 1; // Increment loading
                
                if (currentPercent >= 100) {
                    currentPercent = 100;
                    loadCounter.innerText = `Loading... 100%`;
                    clearInterval(interval);
                } else {
                    loadCounter.innerText = `Loading... ${currentPercent}%`;
                    
                    // Make it spin faster and faster after 50ms milestones
                    if(currentPercent > 30) spinner.style.animationDuration = '0.7s';
                    if(currentPercent > 60) spinner.style.animationDuration = '0.4s';
                    if(currentPercent > 85) spinner.style.animationDuration = '0.2s';
                }
            }, speed);
        }

        // Trigger load sequence right on start
        startLoadingSequence();

        // Transition into the main app on click
        startBtn.addEventListener('click', () => {
            // Animate text moving together towards the center logo
            textVikea.style.transform = 'translateX(65px)';
            textAi.style.transform = 'translateX(-65px)';
            spinner.style.animationDuration = '0.1s';

            setTimeout(() => {
                entranceScreen.style.opacity = '0';
                setTimeout(() => {
                    entranceScreen.style.display = 'none';
                    mainApp.style.display = 'flex';
                }, 500);
            }, 600);
        });
    </script>
</body>
</html>
