<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --surface-color: #1e1f20;
            --surface-hover: #2d2e30;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #8ab4f8;
            --button-blue: #1a73e8;
            --border-color: #333537;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            font-size: 18px;
            font-weight: 500;
        }

        .brand-logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            border-radius: 50%;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: var(--surface-hover);
            color: var(--text-primary);
        }

        .new-chat-btn {
            background-color: var(--surface-hover);
            color: var(--text-primary);
            border: none;
            padding: 10px 14px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            width: fit-content;
        }

        .new-chat-btn:hover {
            background-color: var(--border-color);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 10px;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            width: 100%;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background-color: var(--surface-hover);
            color: var(--text-primary);
        }

        .nav-item.active-mode {
            background-color: rgba(138, 180, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(138, 180, 248, 0.3);
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-profile-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
        }

        .user-profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #7c3aed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-info {
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Chat History Stream */
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        /* "What's the vibe, Wahaj?" welcome view matching user image */
        .welcome-vibe-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 24px;
            animation: fadeIn 0.5s ease;
        }

        .welcome-title-vibe {
            font-size: 38px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Centered Prompt Box for Vibe screen */
        .centered-prompt-box {
            background-color: var(--surface-color);
            border-radius: 32px;
            padding: 14px 20px;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .centered-textarea {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            resize: none;
            outline: none;
            width: 100%;
            max-height: 150px;
        }

        .centered-input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease;
            max-width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            background-color: var(--surface-color);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            max-width: 85%;
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: var(--surface-hover);
        }

        .attached-preview-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
            border: 1px solid var(--border-color);
        }

        /* Smooth Thinking Animation 3 Dots */
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
        }

        .thinking-dots span {
            width: 8px;
            height: 8px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Bottom Fixed Input Area when chatting */
        .input-area {
            padding: 10px 24px 16px 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-box-wrapper {
            background-color: var(--surface-color);
            border-radius: 28px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn {
            background-color: var(--button-blue);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Modal Overlay for Settings */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 16px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-box h3 {
            font-size: 20px;
            font-weight: 500;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .modal-box input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-cancel {
            background: none;
            color: var(--text-secondary);
        }

        .btn-save {
            background-color: var(--button-blue);
            color: white;
        }

        footer {
            text-align: center;
            padding: 8px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <sidebar>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo-icon"></div>
                <span>Vikea AI</span>
            </div>
            <button class="new-chat-btn" onclick="resetToVibeScreen()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>
            <div class="sidebar-nav">
                <button class="nav-item" id="deepSearchNavBtn" onclick="toggleDeepSearchMode()">
                    <span class="material-symbols-outlined">psychology</span>
                    Deep Search Mode
                </button>
                <button class="nav-item" onclick="openSettings()">
                    <span class="material-symbols-outlined">settings</span>
                    Settings & Name
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row">
                <div class="user-profile-left">
                    <div class="user-avatar" id="avatarLetter">W</div>
                    <div class="user-info" id="userNameDisplay">Wahaj Farooq</div>
                </div>
                <button class="icon-btn" onclick="openSettings()" title="Settings">
                    <span class="material-symbols-outlined" style="font-size: 20px;">settings</span>
                </button>
            </div>
        </div>
    </sidebar>

    <!-- Main Container -->
    <div class="main-container">
        <header>
            <span id="headerTitle">Vikea AI</span>
            <div class="header-right"></div>
        </header>

        <!-- Chat Stream Area -->
        <div class="chat-stream" id="chatStream">
            <!-- Initial "What's the vibe, Wahaj?" Screen -->
            <div class="welcome-vibe-container" id="vibeWelcomeScreen">
                <div class="welcome-title-vibe" id="vibeTitle">What's the vibe, Wahaj?</div>
                <div class="centered-prompt-box">
                    <textarea class="centered-textarea" id="vibeInput" placeholder="Ask about math, English, computer science, coding, or drop media..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event, 'vibe')"></textarea>
                    
                    <div id="imagePreviewContainer" style="display:none; position:relative; width: fit-content;">
                        <img id="previewImgElement" class="attached-preview-img" src="" alt="attachment preview">
                        <button onclick="clearAttachedImage()" style="position:absolute; top:-8px; right:-8px; background:#333; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;">×</button>
                    </div>

                    <div class="centered-input-actions">
                        <div style="display:flex; gap:4px;">
                            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach image or video">
                                <span class="material-symbols-outlined">add</span>
                            </button>
                            <input type="file" id="fileInput" style="display:none" accept="image/*,video/*" onchange="handleFileSelect(event)">
                            <button class="icon-btn" onclick="toggleSpeechRecognition('vibe')" title="Speech to text">
                                <span class="material-symbols-outlined" id="micIconVibe">mic</span>
                            </button>
                        </div>
                        <button class="send-btn" onclick="sendFromVibeScreen()">
                            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fixed Bottom Input Area (Appears once conversation starts) -->
        <div class="input-area" id="activeInputArea" style="display: none;">
            <div class="input-box-wrapper">
                <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event, 'active')"></textarea>
                
                <div id="imagePreviewContainerActive" style="display:none; position:relative; width: fit-content;">
                    <img id="previewImgElementActive" class="attached-preview-img" src="" alt="attachment preview">
                    <button onclick="clearAttachedImage()" style="position:absolute; top:-8px; right:-8px; background:#333; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;">×</button>
                </div>

                <div class="input-actions">
                    <div style="display:flex; gap:4px;">
                        <button class="icon-btn" onclick="document.getElementById('fileInputActive').click()" title="Attach image or video">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                        <input type="file" id="fileInputActive" style="display:none" accept="image/*,video/*" onchange="handleFileSelect(event)">
                        <button class="icon-btn" onclick="toggleSpeechRecognition('active')" title="Speech to text">
                            <span class="material-symbols-outlined" id="micIconActive">mic</span>
                        </button>
                    </div>
                    <button class="send-btn" onclick="sendFromActiveArea()">
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                    </button>
                </div>
            </div>
            <footer>Made by Wahaj © 2026</footer>
        </div>
    </div>

    <!-- Settings / Name Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <h3>Settings & Name</h3>
            <p>Update what Vikea AI calls you.</p>
            <input type="text" id="nameInputModal" placeholder="Enter your name (e.g. Wahaj Farooq)">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn-save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let userName = localStorage.getItem('vikea_username') || 'Wahaj Farooq';
        let deepSearchActive = false;
        let lastMathExpression = null;
        let attachedImageData = null;
        let conversationStarted = false;

        updateUserDisplay();

        function updateUserDisplay() {
            document.getElementById('userNameDisplay').innerText = userName;
            document.getElementById('avatarLetter').innerText = userName.charAt(0).toUpperCase();
            const vibeTitle = document.getElementById('vibeTitle');
            if (vibeTitle) {
                vibeTitle.innerText = `What's the vibe, ${userName.split(' ')[0]}?`;
            }
        }

        function openSettings() {
            document.getElementById('nameInputModal').value = userName;
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const val = document.getElementById('nameInputModal').value.trim();
            if (val) {
                userName = val;
                localStorage.setItem('vikea_username', userName);
                updateUserDisplay();
            }
            closeSettings();
        }

        function toggleDeepSearchMode() {
            deepSearchActive = !deepSearchActive;
            const navBtn = document.getElementById('deepSearchNavBtn');
            const stream = document.getElementById('chatStream');
            
            if (deepSearchActive) {
                navBtn.classList.add('active-mode');
            } else {
                navBtn.classList.remove('active-mode');
            }

            // If conversation is already going, append status message in chat
            if (conversationStarted) {
                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai';
                if (deepSearchActive) {
                    aiMsgDiv.innerHTML = `<div class="message-content">Deep search mode activated. Turn off deep search to unactivate.</div>`;
                } else {
                    aiMsgDiv.innerHTML = `<div class="message-content">Deep search mode turned off. Standard search mode activated.</div>`;
                }
                stream.appendChild(aiMsgDiv);
                stream.scrollTop = stream.scrollHeight;
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                attachedImageData = e.target.result;
                document.getElementById('previewImgElement').src = attachedImageData;
                document.getElementById('imagePreviewContainer').style.display = 'block';
                document.getElementById('previewImgElementActive').src = attachedImageData;
                document.getElementById('imagePreviewContainerActive').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearAttachedImage() {
            attachedImageData = null;
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imagePreviewContainerActive').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInputActive').value = '';
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKey(event, origin) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (origin === 'vibe') sendFromVibeScreen();
                else sendFromActiveArea();
            }
        }

        function resetToVibeScreen() {
            conversationStarted = false;
            lastMathExpression = null;
            clearAttachedImage();
            const stream = document.getElementById('chatStream');
            stream.innerHTML = `
                <div class="welcome-vibe-container" id="vibeWelcomeScreen">
                    <div class="welcome-title-vibe" id="vibeTitle">What's the vibe, ${userName.split(' ')[0]}?</div>
                    <div class="centered-prompt-box">
                        <textarea class="centered-textarea" id="vibeInput" placeholder="Ask about math, English, computer science, coding, or drop media..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event, 'vibe')"></textarea>
                        
                        <div id="imagePreviewContainer" style="display:none; position:relative; width: fit-content;">
                            <img id="previewImgElement" class="attached-preview-img" src="" alt="attachment preview">
                            <button onclick="clearAttachedImage()" style="position:absolute; top:-8px; right:-8px; background:#333; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;">×</button>
                        </div>

                        <div class="centered-input-actions">
                            <div style="display:flex; gap:4px;">
                                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach image or video">
                                    <span class="material-symbols-outlined">add</span>
                                </button>
                                <input type="file" id="fileInput" style="display:none" accept="image/*,video/*" onchange="handleFileSelect(event)">
                                <button class="icon-btn" onclick="toggleSpeechRecognition('vibe')" title="Speech to text">
                                    <span class="material-symbols-outlined" id="micIconVibe">mic</span>
                                </button>
                            </div>
                            <button class="send-btn" onclick="sendFromVibeScreen()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('activeInputArea').style.display = 'none';
        }

        function sendFromVibeScreen() {
            const input = document.getElementById('vibeInput');
            const text = input.value.trim();
            if (!text && !attachedImageData) return;

            // Transition UI from Vibe Welcome screen to active chat stream
            const vibeScreen = document.getElementById('vibeWelcomeScreen');
            if (vibeScreen) vibeScreen.remove();
            document.getElementById('activeInputArea').style.display = 'block';
            conversationStarted = true;

            processUserQuery(text);
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text && !attachedImageData) return;

            input.value = '';
            input.style.height = 'auto';
            processUserQuery(text);
        }

        function processUserQuery(text) {
            const stream = document.getElementById('chatStream');

            // Build user message HTML
            let userHtml = '';
            if (attachedImageData) {
                userHtml += `<img class="attached-preview-img" src="${attachedImageData}" alt="user upload">`;
            }
            if (text) {
                userHtml += `<div>${escapeHtml(text)}</div>`;
            }

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-content">${userHtml}</div>`;
            stream.appendChild(userMsgDiv);

            // Clear inputs
            const vibeInput = document.getElementById('vibeInput');
            if (vibeInput) vibeInput.value = '';
            const activeInput = document.getElementById('activeInput');
            if (activeInput) activeInput.value = '';
            const currentImg = attachedImageData;
            clearAttachedImage();

            stream.scrollTop = stream.scrollHeight;

            // Append 3-dot thinking animation bubble
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.id = 'thinkingBubble';
            thinkingDiv.innerHTML = `
                <div class="message-content">
                    <div class="thinking-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            stream.appendChild(thinkingDiv);
            stream.scrollTop = stream.scrollHeight;

            // Timing: Deep Search Mode = 5-10s, Normal Mode = 2-3s delay
            let delayTime = deepSearchActive 
                ? Math.floor(Math.random() * 5000) + 5000 
                : Math.floor(Math.random() * 1000) + 2000;

            setTimeout(() => {
                const bubble = document.getElementById('thinkingBubble');
                if (bubble) bubble.remove();

                let response = "";
                const cleanText = text.toLowerCase();
                const wantsBreakdown = cleanText.includes('break') || cleanText.includes('yes') || cleanText.includes('sure') || cleanText.includes('how');
                
                if (currentImg) {
                    response = `I have analyzed the image/video you sent along with your prompt ("${escapeHtml(text)}"). As Vikea AI, I can see the visual elements clearly and assist you with any questions related to it across subjects like computer science, coding, or general analysis!`;
                } else {
                    let mathCandidate = null;
                    const matches = text.match(/[\d\s\+\-\*\/\.\(\)]+/g);
                    if (matches) {
                        for (let m of matches) {
                            let trimmed = m.trim();
                            if (trimmed.length >= 3 && /[\+\-\*\/]/.test(trimmed) && /\d/.test(trimmed)) {
                                mathCandidate = trimmed;
                                break;
                            }
                        }
                    }

                    if (wantsBreakdown && lastMathExpression) {
                        try {
                            let evalResult = eval(lastMathExpression);
                            response = `Here is the comprehensive step-by-step breakdown for <strong>${escapeHtml(lastMathExpression)}</strong>, requested by ${userName}:<br><br>
                            1. **Expression Identification:** <code>${escapeHtml(lastMathExpression)}</code><br>
                            2. **Execution Steps:** Applying standard mathematical operations.<br>
                            3. **Outcome:** <strong>${evalResult}</strong>.`;
                            lastMathExpression = null;
                        } catch (e) {
                            response = `Here is the detailed breakdown tailored for you, ${userName}.`;
                            lastMathExpression = null;
                        }
                    } else if (mathCandidate) {
                        try {
                            let evalResult = eval(mathCandidate);
                            lastMathExpression = mathCandidate;
                            if (deepSearchActive) {
                                response = `Deep search analysis complete. The evaluated result for ${mathCandidate} is <strong>${evalResult}</strong>. Would you like me to break down the calculation steps?`;
                            } else {
                                response = `${evalResult} should i brake it down?`;
                            }
                        } catch (e) {
                            response = handleGeneralSubject(cleanText, text);
                        }
                    } else {
                        response = handleGeneralSubject(cleanText, text);
                    }
                }

                if (deepSearchActive) {
                    response = `Deep search mode activated. Turn off deep search to unactivate.<br><br>` + response;
                }

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai';
                aiMsgDiv.innerHTML = `<div class="message-content">${response}</div>`;
                stream.appendChild(aiMsgDiv);
                stream.scrollTop = stream.scrollHeight;
            }, delayTime);
        }

        function handleGeneralSubject(cleanText, originalText) {
            if (cleanText.includes('code') || cleanText.includes('python') || cleanText.includes('html') || cleanText.includes('javascript') || cleanText.includes('coding')) {
                return `As Vikea AI, I can help you write, debug, and optimize code across Python, JavaScript, HTML, and C++. What coding project are we building today, ${userName}?`;
            } else if (cleanText.includes('computer science') || cleanText.includes('algorithm') || cleanText.includes('cpu')) {
                return `In computer science, systems rely on architectural logic, memory management, and data structures. I can help explain algorithms, networking, or hardware concepts clearly.`;
            } else if (cleanText.includes('english') || cleanText.includes('grammar') || cleanText.includes('essay')) {
                return `For English and literature, crafting clear thesis statements and structured arguments is key. Let me know if you need help proofreading or analyzing text, ${userName}!`;
            } else if (cleanText.includes('hello') || cleanText.includes('hi')) {
                return `Hello, ${userName}! I'm Vikea AI, ready to solve problems across math, English, computer science, and coding. What's the vibe today?`;
            } else {
                return `I've processed your query: "${escapeHtml(originalText)}". As your multi-subject Vikea AI assistant, I'm ready to help you solve it across math, English, computer science, coding, and more.`;
            }
        }

        function toggleSpeechRecognition(origin) {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition is not supported in this browser.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                const icon = origin === 'vibe' ? document.getElementById('micIconVibe') : document.getElementById('micIconActive');
                if (icon) icon.style.color = '#8ab4f8';
            };

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                if (origin === 'vibe') {
                    document.getElementById('vibeInput').value = speechText;
                    autoResize(document.getElementById('vibeInput'));
                } else {
                    document.getElementById('activeInput').value = speechText;
                    autoResize(document.getElementById('activeInput'));
                }
            };

            recognition.onend = function() {
                const icon = origin === 'vibe' ? document.getElementById('micIconVibe') : document.getElementById('micIconActive');
                if (icon) icon.style.color = '';
            };

            recognition.start();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
