<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --surface-color: #1e1f20;
            --surface-hover: #2d2e30;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #8ab4f8;
            --button-blue: #1a73e8;
            --border-color: #333537;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        
        /* Permanent Sidebar */
        aside { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-top { display: flex; flex-direction: column; gap: 16px; }
        .brand-header { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; padding: 4px 8px; }
        .brand-logo-icon { width: 24px; height: 24px; background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570); border-radius: 50%; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: none; padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; }
        .new-chat-btn:hover { background-color: var(--border-color); }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 12px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: rgba(138, 180, 248, 0.15); color: var(--accent-blue); border: 1px solid rgba(138, 180, 248, 0.3); }

        .user-profile-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background-color: var(--surface-hover); }
        .user-avatar { width: 32px; height: 32px; background-color: #3c4043; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; font-size: 14px; }
        .user-info { font-size: 13px; color: var(--text-primary); }

        /* Main Container */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: var(--accent-blue); padding: 4px 10px; border-radius: 12px; }

        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 900px; width: 100%; margin: 0 auto; }
        
        .welcome-vibe-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 24px; }
        .welcome-title-vibe { font-size: 38px; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #4285f4); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shineGradient 6s linear infinite; text-align: center; }

        @keyframes shineGradient { to { background-position: 300% center; } }

        .glow-border-wrapper { position: relative; width: 100%; max-width: 720px; border-radius: 28px; padding: 2px; background: linear-gradient(60deg, #4285f4, #9b72cb, #d96570, #4285f4); background-size: 300% 300%; animation: rotateGlow 5s ease infinite; }
        @keyframes rotateGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .centered-prompt-box { background-color: var(--surface-color); border-radius: 26px; padding: 14px 18px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .centered-textarea { background: none; border: none; color: var(--text-primary); font-size: 16px; resize: none; outline: none; width: 100%; }
        
        .prompt-toolbar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .toolbar-left { display: flex; gap: 8px; align-items: center; }
        
        .deep-search-chip { display: flex; align-items: center; gap: 6px; background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; transition: 0.2s; }
        .deep-search-chip:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .deep-search-chip.active { background-color: rgba(138, 180, 248, 0.15); border-color: var(--accent-blue); color: var(--accent-blue); }

        .message { display: flex; gap: 14px; max-width: 100%; }
        .message.user { flex-direction: row-reverse; align-self: flex-end; }
        .message.ai { justify-content: flex-start; align-self: flex-start; width: 100%; }
        .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; background-color: #3c4043; color: white; flex-shrink: 0; }
        .message.ai .message-content { color: var(--text-primary); font-size: 15px; line-height: 1.6; width: 100%; }
        .message.user .message-content { background-color: var(--surface-hover); padding: 12px 18px; border-radius: 18px 18px 4px 18px; font-size: 15px; }

        .thinking-container { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: var(--surface-color); border-radius: 20px; width: fit-content; border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 14px; }
        .circle-dot { width: 8px; height: 8px; background: linear-gradient(135deg, #4285f4, #9b72cb); border-radius: 50%; animation: pulseCircle 1.2s infinite ease-in-out; }
        .circle-dot:nth-child(2) { animation-delay: 0.2s; }
        .circle-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulseCircle { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; } 40% { transform: scale(1.2); opacity: 1; } }

        .deep-thought-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent-blue); padding: 10px 14px; border-radius: 4px; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-family: monospace; }

        .input-area { padding: 12px 24px 16px 24px; max-width: 900px; width: 100%; margin: 0 auto; }
        .input-box-wrapper { background-color: var(--surface-color); border-radius: 28px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); }
        #activeInput { background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; width: 100%; }
        
        .send-btn { background-color: var(--button-blue); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
        footer { text-align: center; padding: 6px; color: var(--text-secondary); font-size: 12px; }
    </style>
</head>
<body>

    <!-- Permanent Sidebar -->
    <aside>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo-icon"></div>
                <span>Vikea AI</span>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>
            <div class="sidebar-section-title">Engine Mode</div>
            <div class="sidebar-nav">
                <button class="nav-item active-mode">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Vikea Pro AI
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row">
                <div class="user-avatar">W</div>
                <div class="user-info">Wahaj</div>
            </div>
        </div>
    </aside>

    <!-- Main App Container -->
    <div class="main-container">
        <header>
            <span id="headerTitle">Vikea AI Assistant</span>
            <div class="model-badge-header">Pro / Deep Search Ready</div>
        </header>

        <div class="chat-stream" id="chatStream">
            <!-- Welcome Screen with Integrated Toolbar -->
            <div class="welcome-vibe-container" id="vibeWelcomeScreen">
                <div class="welcome-title-vibe">What's the vibe, Wahaj?</div>
                
                <div class="glow-border-wrapper">
                    <div class="centered-prompt-box">
                        <textarea class="centered-textarea" id="vibeInput" placeholder="Ask questions, math, code..." rows="1" onkeydown="handleKey(event, 'vibe')"></textarea>
                        <div class="prompt-toolbar">
                            <div class="toolbar-left">
                                <div class="deep-search-chip" id="vibeDeepSearchChip" onclick="toggleDeepSearch('vibe')">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">globe_asia</span>
                                    <span id="vibeDeepSearchText">Deep Search: Off</span>
                                </div>
                            </div>
                            <button class="send-btn" onclick="sendFromVibeScreen()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sticky Bottom Input Area (Hidden initially, reveals after first message) -->
        <div class="input-area" id="activeInputArea" style="display: none;">
            <div class="input-box-wrapper">
                <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" onkeydown="handleKey(event, 'active')"></textarea>
                <div class="prompt-toolbar" style="border:none; padding-top:0;">
                    <div class="toolbar-left">
                        <div class="deep-search-chip" id="activeDeepSearchChip" onclick="toggleDeepSearch('active')">
                            <span class="material-symbols-outlined" style="font-size: 16px;">globe_asia</span>
                            <span id="activeDeepSearchText">Deep Search: Off</span>
                        </div>
                    </div>
                    <button class="send-btn" onclick="sendFromActiveArea()">
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                    </button>
                </div>
            </div>
            <footer>Made by Wahaj © 2026</footer>
        </div>
    </div>

    <script>
        let deepSearchEnabled = false;

        function toggleDeepSearch(origin) {
            deepSearchEnabled = !deepSearchEnabled;
            const vibeChip = document.getElementById('vibeDeepSearchChip');
            const activeChip = document.getElementById('activeDeepSearchChip');
            const vibeText = document.getElementById('vibeDeepSearchText');
            const activeText = document.getElementById('activeDeepSearchText');

            if (deepSearchEnabled) {
                if(vibeChip) vibeChip.classList.add('active');
                if(activeChip) activeChip.classList.add('active');
                if(vibeText) vibeText.innerText = "Deep Search: On";
                if(activeText) activeText.innerText = "Deep Search: On";
            } else {
                if(vibeChip) vibeChip.classList.remove('active');
                if(activeChip) activeChip.classList.remove('active');
                if(vibeText) vibeText.innerText = "Deep Search: Off";
                if(activeText) activeText.innerText = "Deep Search: Off";
            }
        }

        function handleKey(event, origin) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (origin === 'vibe') sendFromVibeScreen();
                else sendFromActiveArea();
            }
        }

        function sendFromVibeScreen() {
            const input = document.getElementById('vibeInput');
            const text = input.value.trim();
            if (!text) return;

            document.getElementById('vibeWelcomeScreen').remove();
            document.getElementById('activeInputArea').style.display = 'block';
            processUserQuery(text);
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserQuery(text);
        }

        function processUserQuery(query) {
            const stream = document.getElementById('chatStream');

            // Append User Message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-avatar">W</div><div class="message-content">${escapeHtml(query)}</div>`;
            stream.appendChild(userMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            // Append Thinking Bubble
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.id = 'thinkingBubble';
            thinkingDiv.innerHTML = `
                <div class="message-avatar" style="background:linear-gradient(135deg, #4285f4, #9b72cb);">V</div>
                <div class="thinking-container">
                    <div class="circle-dot"></div><div class="circle-dot"></div><div class="circle-dot"></div>
                    <span>${deepSearchEnabled ? 'Performing Deep Search & reasoning...' : 'Thinking...'}</span>
                </div>
            `;
            stream.appendChild(thinkingDiv);
            stream.scrollTop = stream.scrollHeight;

            // Generate Smart Response after delay
            setTimeout(() => {
                const bubble = document.getElementById('thinkingBubble');
                if(bubble) bubble.remove();

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai';
                
                let answerHtml = generateSmartAnswer(query, deepSearchEnabled);

                aiMsgDiv.innerHTML = `
                    <div class="message-avatar" style="background:linear-gradient(135deg, #4285f4, #9b72cb);">V</div>
                    <div class="message-content">${answerHtml}</div>
                `;
                stream.appendChild(aiMsgDiv);
                stream.scrollTop = stream.scrollHeight;
            }, deepSearchEnabled ? 1800 : 1000);
        }

        function generateSmartAnswer(q, isDeep) {
            const lower = q.toLowerCase();
            let response = "";
            let reasoning = isDeep ? `<div class="deep-thought-box">🔍 Deep Search executed across multiple knowledge bases & web indices for: "${escapeHtml(q)}"</div>` : "";

            if (lower.includes('1+1') || lower.includes('1 + 1') || lower.includes('what is 1')) {
                response = "1 + 1 = <strong>2</strong>.";
            } else if (lower.includes('hello') || lower.includes('hi')) {
                response = "Hello Wahaj! How can Vikea AI assist you with your projects today?";
            } else if (lower.includes('weather')) {
                response = "To check exact weather conditions, please specify your city or region!";
            } else if (lower.includes('code') || lower.includes('html') || lower.includes('javascript')) {
                response = `Here is a quick snippet based on your request:<br><pre style="background:#1e1f20; padding:10px; border-radius:6px; margin-top:8px; overflow-x:auto;"><code>// Vikea AI Code Engine
function greetUser(name) {
    console.log("Hello, " + name + "!");
}
greetUser("Wahaj");</code></pre>`;
            } else {
                response = `Here is the analysis regarding <em>"${escapeHtml(q)}"</em>:<br><br>Vikea AI processed your inquiry successfully. Everything is fully functional and operating on custom parameters. Let me know if you need deeper adjustments!`;
            }

            return reasoning + response;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
