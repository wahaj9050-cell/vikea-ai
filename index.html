<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI v1.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #0a0a0a;
            --surface-hover: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #262626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }

        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .sidebar-top { display: flex; flex-direction: column; gap: 16px; }
        .brand-header { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; padding: 4px 8px; color: #fff; }
        .brand-logo-icon { width: 28px; height: 28px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #fff; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #333; }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 12px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; transition: 0.2s; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: #262626; color: #fff; border: 1px solid #404040; }

        .user-profile-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background-color: var(--surface-hover); border: 1px solid var(--border-color); cursor: pointer; }
        .user-avatar { width: 32px; height: 32px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; }
        .user-info { font-size: 13px; color: var(--text-primary); }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 10; }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: #fff; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); }

        /* WELCOME SCREEN: Plug in your Galaxy background image URL below */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('YOUR_GALAXY_IMAGE_URL_HERE.jpg') no-repeat center center;
            background-size: cover;
            background-color: #050505; /* Fallback color if image path is pending */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1), background-color 0.9s ease, opacity 0.9s ease;
        }
        
        /* Zoom-in to pic then go black transition effect */
        .welcome-screen.zoom-to-black {
            transform: scale(3.5);
            background-color: #000000;
            background-image: none;
            opacity: 0;
            pointer-events: none;
        }

        .welcome-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .welcome-title {
            font-size: 56px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .start-chat-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(8px);
        }
        .start-chat-btn:hover {
            background-color: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .version-label {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }

        /* CHAT SCREEN: Plug in your Earth/Horizon background image URL below */
        .chat-container-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('YOUR_EARTH_HORIZON_IMAGE_URL_HERE.jpg') no-repeat center center;
            background-size: cover;
            background-color: #000000;
            display: none;
            flex-direction: column;
            z-index: 5;
        }
        .chat-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.65); /* Darkens background slightly so text reads easily */
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; scroll-behavior: smooth; z-index: 3; }
        
        .message { display: flex; gap: 14px; max-width: 100%; }
        .message.user { flex-direction: row-reverse; align-self: flex-end; }
        .message.ai { justify-content: flex-start; align-self: flex-start; width: 100%; }
        
        .message-avatar { width: 32px; height: 32px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; flex-shrink: 0; }
        .message.ai .message-content { color: var(--text-primary); font-size: 15px; line-height: 1.6; width: 100%; word-break: break-word; }
        .message.user .message-content { background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 18px 18px 4px 18px; font-size: 15px; word-break: break-word; }

        .input-area { padding: 12px 24px 16px 24px; max-width: 950px; width: 100%; margin: 0 auto; z-index: 3; }
        .input-box-wrapper { background-color: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px); border-radius: 28px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); }
        #activeInput { background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; width: 100%; min-height: 24px; }
        
        .send-btn { background-color: #fff; color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
        footer { text-align: center; padding: 6px; color: var(--text-secondary); font-size: 12px; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo-icon">V</div>
                <span>Vikea AI</span>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>
            <div class="sidebar-section-title">Engine Mode</div>
            <div class="sidebar-nav">
                <button class="nav-item active-mode" id="navUniversal" onclick="switchEngineMode('universal')">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Multi-Universal Core
                </button>
                <button class="nav-item" id="navCells" onclick="switchEngineMode('cells')">
                    <span class="material-symbols-outlined">biotech</span>
                    GCSE Cell Biology
                </button>
                <button class="nav-item" id="navPeriodic" onclick="switchEngineMode('periodic')">
                    <span class="material-symbols-outlined">science</span>
                    AQA Periodic Table & Atoms
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row" onclick="changeUserName()" title="Click to change name">
                <div class="user-avatar" id="userAvatarLetter">W</div>
                <div class="user-info" id="userNameLabel">Wahaj</div>
            </div>
        </div>
    </aside>

    <div class="main-container">
        <header>
            <span id="headerTitle">Vikea AI Assistant</span>
            <div class="model-badge-header" id="modelBadgeHeader">Universal Engine Active</div>
        </header>

        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-content">
                <h1 class="welcome-title">Vikea AI</h1>
                <button class="start-chat-btn" onclick="startChatTransition()">Start Chatting</button>
            </div>
            <div class="version-label">Version 1.3</div>
        </div>

        <!-- Chat Screen Background -->
        <div class="chat-container-bg" id="chatContainerBg">
            <div class="chat-overlay">
                <div class="chat-stream" id="chatStream"></div>
                <div class="input-area" id="activeInputArea">
                    <div class="input-box-wrapper">
                        <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" onkeydown="handleKey(event)"></textarea>
                        <div class="prompt-toolbar" style="display:flex; justify-content:flex-end; border:none; padding-top:0;">
                            <button class="send-btn" onclick="sendFromActiveArea()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                    <footer>Made with Vikea Multi-Universal Engine © 2026</footer>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserName = "Wahaj";

        function changeUserName() {
            const newName = prompt("Enter your new name:", currentUserName);
            if (newName && newName.trim() !== "") {
                currentUserName = newName.trim();
                document.getElementById('userNameLabel').innerText = currentUserName;
                document.getElementById('userAvatarLetter').innerText = currentUserName.charAt(0).toUpperCase();
            }
        }

        function startChatTransition() {
            const welcome = document.getElementById('welcomeScreen');
            welcome.classList.add('zoom-to-black'); // Triggers zoom-in and fade to black

            setTimeout(() => {
                welcome.style.display = 'none';
                const chatBg = document.getElementById('chatContainerBg');
                chatBg.style.display = 'flex';
                
                // Triggers AI greeting using your format: "Hi, [name] how can i help you?"[cite: 19]
                triggerInitialGreeting();
            }, 800);
        }

        function triggerInitialGreeting() {
            const stream = document.getElementById('chatStream');
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `
                <div class="message-avatar">V</div>
                <div class="message-content">Hi, ${currentUserName} how can I help you?</div>
            `;
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
            document.getElementById('activeInput').focus();
        }

        function switchEngineMode(mode) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-mode'));
            if (document.getElementById('welcomeScreen').style.display !== 'none') {
                startChatTransition();
            }
            if (mode === 'universal') {
                document.getElementById('navUniversal').classList.add('active-mode');
                document.getElementById('modelBadgeHeader').innerText = "Universal Engine Active";
            } else if (mode === 'cells') {
                document.getElementById('navCells').classList.add('active-mode');
            } else if (mode === 'periodic') {
                document.getElementById('navPeriodic').classList.add('active-mode');
            }
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendFromActiveArea();
            }
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserQuery(text);
        }

        async function processUserQuery(query) {
            const stream = document.getElementById('chatStream');
            const userInitial = currentUserName.charAt(0).toUpperCase();

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-avatar">${userInitial}</div><div class="message-content">${escapeHtml(query)}</div>`;
            stream.appendChild(userMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            await new Promise(r => setTimeout(r, 600));

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `
                <div class="message-avatar">V</div>
                <div class="message-content">I have processed your query: <strong>"${escapeHtml(query)}"</strong>. What else can I help you with today, ${currentUserName}?</div>
            `;
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
