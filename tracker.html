<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea Maps Alpha</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px; background: #111; border-bottom: 1px solid #222; font-size: 18px; font-weight: bold; }
        #map { flex: 1; width: 100%; }
    </style>
</head>
<body>

    <header>Vikea Maps Alpha</header>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on a specific latitude/longitude (e.g., London)
        const map = L.map('map').setView([51.505, -0.09], 13);

        // Load dark-themed map tiles to match your Vikea AI aesthetic
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // Add a custom marker
        const marker = L.marker([51.505, -0.09]).addTo(map);
        marker.binding = marker.bindPopup("<b>Vikea HQ is here!</b>").openPopup();
    </script>
</body>
</html>]
