<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea Maps Alpha</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 16px 24px; background: #050505; border-bottom: 1px solid #222; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 10px; z-index: 10; }
        .brand-logo-icon { width: 28px; height: 28px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        #map { flex: 1; width: 100%; z-index: 1; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo-icon">V</div>
        <span>Vikea Maps Alpha</span>
    </header>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on coordinates (e.g., London)
        const map = L.map('map').setView([51.505, -0.09], 13);

        // OpenStreetMap tiles - 100% Free, No API Key Required
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Add a custom marker for Vikea HQ
        const marker = L.marker([51.505, -0.09]).addTo(map);
        marker.bindPopup("<b>Vikea HQ is here!</b>").openPopup();
    </script>
</body>
</html>
