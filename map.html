<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI & Maps Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --surface-color: #111111;
            --surface-hover: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        html, body { 
            background-color: #000000; 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        /* FULLSCREEN INTRO OVERLAY - Completely hides sidebar & toolbars */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
            z-index: 99999;
            overflow: hidden;
        }

        .welcome-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: auto;
            margin-bottom: auto;
            position: relative;
        }

        .title-left, .title-right { 
            font-size: 64px; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: #ffffff; 
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: inline-block;
        }

        /* Directional Title Fades */
        .title-left.fade-left {
            opacity: 0;
            transform: translateX(-220px);
        }
        .title-right.fade-right {
            opacity: 0;
            transform: translateX(220px);
        }

        .orbit-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-center-v {
            width: 54px;
            height: 54px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 2;
            transition: transform 0.3s ease, background 0.3s ease, opacity 0.4s ease, box-shadow 0.3s ease;
        }

        /* White Ring Removed */
        .orbit-ring {
            display: none !important;
        }

        .dot { 
            position: absolute; 
            width: 7px; 
            height: 7px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #ffffff; 
            transition: all 0.4s ease;
        }

        /* Default Orbiting Positions */
        .d1 { top: 2px; left: 51px; } .d2 { top: 16px; left: 83px; } .d3 { top: 51px; left: 101px; } .d4 { top: 85px; left: 83px; }
        .d5 { top: 100px; left: 51px; } .d6 { top: 85px; left: 18px; } .d7 { top: 51px; left: 0px; } .d8 { top: 16px; left: 18px; }

        .orbit-container.spin-dots {
            animation: spinDots 4s linear infinite;
        }

        @keyframes spinDots {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 1. OG Inward Contracting & Star Shake ("ting ting") */
        .stage-og-contract .dot { 
            top: 51px !important; 
            left: 51px !important; 
        }
        .stage-og-contract .orbit-center-v { 
            animation: starShakePulse 0.12s infinite alternate; 
            background: #ffffff;
            box-shadow: 0 0 25px #ffffff, 0 0 50px #ffffff, 0 0 75px #ffffff;
        }

        @keyframes starShakePulse {
            0% { transform: scale(1) translate(-2px, -2px); }
            100% { transform: scale(1.25) translate(2px, 2px); }
        }

        /* 2. 5-Second Army Battle Phase */
        .stage-army-fight .orbit-container { animation: none; }
        .stage-army-fight .dot {
            animation: armyBattle 0.25s infinite alternate ease-in-out;
        }
        .stage-army-fight .d1 { animation-delay: 0.02s; }
        .stage-army-fight .d2 { animation-delay: 0.05s; }
        .stage-army-fight .d3 { animation-delay: 0.08s; }
        .stage-army-fight .d4 { animation-delay: 0.11s; }
        .stage-army-fight .d5 { animation-delay: 0.14s; }
        .stage-army-fight .d6 { animation-delay: 0.17s; }
        .stage-army-fight .d7 { animation-delay: 0.20s; }
        .stage-army-fight .d8 { animation-delay: 0.23s; }

        @keyframes armyBattle {
            0% { transform: translate(-40px, -30px) scale(1.2); }
            50% { transform: translate(45px, 35px) scale(0.8); }
            100% { transform: translate(-25px, 40px) scale(1.4); }
        }

        /* 3. Attack V & Kill V Phase */
        .stage-attack-v .dot {
            animation: none !important;
            top: 51px !important;
            left: 51px !important;
            transform: scale(2);
            box-shadow: 0 0 15px #ffffff;
        }
        .stage-attack-v .orbit-center-v {
            animation: vFinalShake 0.08s infinite alternate !important;
            opacity: 0.5;
        }
        @keyframes vFinalShake {
            0% { transform: translate(-6px, -6px) scale(1.3); }
            100% { transform: translate(6px, 6px) scale(0.7); }
        }

        .stage-v-dead .orbit-center-v {
            opacity: 0 !important;
            transform: scale(0) !important;
            transition: all 0.5s ease;
        }

        /* 4. Ceiling Launch */
        .stage-ceiling .dot {
            top: -650px !important;
            opacity: 0;
            transition: top 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        /* 5. Pull Down Curtain to Uncover Chat */
        #pullCurtain {
            position: fixed;
            top: -110%;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 100000;
            transition: top 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #pullCurtain.drop { top: 0%; }
        #pullCurtain.lift { top: 110%; }

        .start-chat-btn {
            background: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 10px;
        }
        .start-chat-btn:hover { background: #e0e0e0; transform: scale(1.04); }
        .version-label { font-size: 11px; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px; }

        /* APP LAYOUT */
        aside { 
            width: 280px; 
            background-color: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 16px; 
            border-right: 1px solid var(--border-color); 
            flex-shrink: 0; 
            z-index: 10; 
        }
        .sidebar-top { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 80px); padding-right: 4px; }
        .brand-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; color: #fff; }
        .brand-left { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
        .brand-logo-icon { width: 28px; height: 28px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #2a2a2a; }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 8px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 9px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; text-align: left; width: 100%; transition: 0.2s; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: #222; color: #fff; border: 1px solid #444; }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; background: #000; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 5; flex-shrink: 0; }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: #fff; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }

        .view-section { width: 100%; height: 100%; display: none; flex-direction: column; background: #000; flex: 1; }
        .view-section.active-view { display: flex; }

        .chat-overlay { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
        
        .center-greeting-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; text-align: center; gap: 12px; color: #ffffff; font
