<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI & Maps Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --surface-hover: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* FULLSCREEN INTRO OVERLAY */
        #welcomeScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 50px 40px; z-index: 500;
        }

        .welcome-content { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 900px; margin: auto; }
        .title-left, .title-right { font-size: 64px; font-weight: 700; color: #fff; transition: all 1.2s ease; }
        .title-left.fade-left { opacity: 0; transform: translateX(-150px); }
        .title-right.fade-right { opacity: 0; transform: translateX(150px); }

        .orbit-container { position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; }
        .orbit-center-v { width: 54px; height: 54px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        .dot { position: absolute; width: 7px; height: 7px; background-color: #fff; border-radius: 50%; transition: all 0.4s ease; }
        
        .d1 { top: 2px; left: 51px; } .d2 { top: 16px; left: 83px; } .d3 { top: 51px; left: 101px; } .d4 { top: 85px; left: 83px; }
        .d5 { top: 100px; left: 51px; } .d6 { top: 85px; left: 18px; } .d7 { top: 51px; left: 0px; } .d8 { top: 16px; left: 18px; }

        .start-chat-btn { background: #fff; color: #000; border: none; padding: 14px 40px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; }

        /* APP LAYOUT */
        aside { width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: #000; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; border-bottom: 1px solid var(--border-color); }
        .view-section { width: 100%; height: 100%; display: none; flex-direction: column; flex: 1; }
        .view-section.active-view { display: flex; }

        .chat-overlay { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; }
        .center-greeting-box { display: flex; align-items: center; justify-content: center; margin: auto; color: #fff; font-size: 32px; }
        
        .input-area { padding: 16px 24px; max-width: 950px; width: 100%; margin: 0 auto; }
        .input-box-wrapper { background: #111; border-radius: 28px; padding: 12px 18px; border: 1px solid var(--border-color); }
        #activeInput { background: none; border: none; color: #fff; font-size: 15px; outline: none; width: 100%; }
        
        #mapView { flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- APP SIDEBAR -->
    <aside>
        <div>
            <h2 style="color:#fff; margin-bottom: 20px;">Vikea AI</h2>
            <button style="background:#222; color:#fff; border:1px solid #444; padding:10px 16px; border-radius:20px; cursor:pointer;" onclick="switchView('chat')">AI Assistant</button>
            <button style="background:none; color:#888; border:none; padding:10px 16px; cursor:pointer;" onclick="switchView('map')">Vikea Maps</button>
        </div>
    </aside>

    <!-- MAIN APP CONTAINER -->
    <div class="main-container">
        <!-- WELCOME SCREEN OVERLAY -->
        <div id="welcomeScreen">
            <div></div>
            <div class="welcome-content">
                <span class="title-left" id="titleLeft">VIKEA</span>
                <div class="orbit-container" id="welcomeOrbit">
                    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>
                    <div class="dot d5"></div><div class="dot d6"></div><div class="dot d7"></div><div class="dot d8"></div>
                    <div class="orbit-center-v" id="orbitCenterV">V</div>
                </div>
                <span class="title-right" id="titleRight">AI</span>
            </div>
            <button class="start-chat-btn" onclick="startChatTransition()">Get Started / Chat</button>
        </div>

        <!-- CHAT VIEW -->
        <div class="view-section active-view" id="chatView">
            <header><span>Vikea AI Assistant</span></header>
            <div class="chat-overlay">
                <div class="chat-stream" id="chatStream">
                    <div class="center-greeting-box"><h1>What's the vibe today?</h1></div>
                </div>
                <div class="input-area">
                    <div class="input-box-wrapper">
                        <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAP VIEW -->
        <div class="view-section" id="mapViewSection">
            <header><span>Vikea Maps Alpha</span></header>
            <div id="mapView"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapInitialized = false;
        let map;

        function switchView(viewName) {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));

            if (viewName === 'chat') {
                document.getElementById('chatView').classList.add('active-view');
            } else if (viewName === 'map') {
                document.getElementById('mapViewSection').classList.add('active-view');
                if (!mapInitialized) {
                    map = L.map('mapView').setView([51.505, -0.09], 13);
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    mapInitialized = true;
                }
            }
        }

        function startChatTransition() {
            document.getElementById('titleLeft').classList.add('fade-left');
            document.getElementById('titleRight').classList.add('fade-right');
            
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
                document.getElementById('activeInput').focus();
            }, 1000);
        }
    </script>
</body>
</html>
