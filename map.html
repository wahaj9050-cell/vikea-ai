<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI & Maps Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --surface-color: #111111;
            --surface-hover: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; perspective: 1000px; }
        
        aside { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .sidebar-top { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 80px); padding-right: 4px; }
        .brand-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; color: #fff; }
        .brand-left { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
        .brand-logo-icon { width: 28px; height: 28px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        
        .new-chat-btn { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; width: fit-content; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #2a2a2a; }

        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 8px 0 4px 8px; font-weight: 600; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { background: none; border: none; color: var(--text-secondary); padding: 9px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; text-align: left; width: 100%; transition: 0.2s; }
        .nav-item:hover { background-color: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active-mode { background-color: #222; color: #fff; border: 1px solid #444; }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; transform-style: preserve-3d; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; font-size: 18px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 10; flex-shrink: 0; }
        .model-badge-header { font-size: 12px; background-color: var(--surface-hover); color: #fff; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }

        /* Views */
        .view-section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: #000; }
        .view-section.active-view { display: flex; z-index: 5; }

        /* Welcome Entrance Screen */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
            z-index: 20;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .welcome-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: auto;
            margin-bottom: auto;
            position: relative;
        }

        .title-left, .title-right { 
            font-size: 64px; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: #ffffff; 
            transition: opacity 2s cubic-bezier(0.25, 1, 0.5, 1), transform 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Directional Fades */
        .title-left.fade-left {
            opacity: 0;
            transform: translateX(-150px);
        }
        .title-right.fade-right {
            opacity: 0;
            transform: translateX(150px);
        }

        .orbit-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-center-v {
            width: 54px;
            height: 54px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 2;
            transition: transform 0.4s ease, background 0.4s ease, opacity 0.4s ease, box-shadow 0.4s ease;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: spinOrbit 4s linear infinite;
        }

        .dot { 
            position: absolute; 
            width: 7px; 
            height: 7px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #ffffff; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .d1 { top: 2px; left: 51px; } .d2 { top: 16px; left: 83px; } .d3 { top: 51px; left: 101px; } .d4 { top: 85px; left: 83px; }
        .d5 { top: 100px; left: 51px; } .d6 { top: 85px; left: 18px; } .d7 { top: 51px; left: 0px; } .d8 { top: 16px; left: 18px; }

        @keyframes spinOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 1. Inward contracting OG Shake effect */
        .stage-shake .orbit-ring { animation-duration: 0.5s; }
        .stage-shake .dot { top: 51px !important; left: 51px !important; }
        .stage-shake .orbit-center-v { 
            animation: starShake 0.1s infinite alternate; 
            background: #ffffff;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ffffff;
        }

        @keyframes starShake {
            0% { transform: translate(-3px, -3px) scale(1.1); }
            100% { transform: translate(3px, 3px) scale(1.2); }
        }

        /* 2. Dots stop orbiting and fight / destroy the V */
        .stage-attack .orbit-ring { animation: none; border-color: transparent; }
        .stage-attack .dot { 
            background: #ff0055; 
            box-shadow: 0 0 15px #ff0055;
            transform: scale(1.8);
        }
        .stage-attack .d1 { top: 20px !important; left: 51px !important; }
        .stage-attack .d2 { top: 80px !important; left: 51px !important; }
        .stage-attack .d3 { top: 51px !important; left: 20px !important; }
        .stage-attack .d4 { top: 51px !important; left: 80px !important; }
        
        .stage-kill-v .orbit-center-v { 
            opacity: 0; 
            transform: scale(0);
        }

        /* 3. Dots shoot to ceiling */
        .stage-ceiling .dot { 
            top: -500px !important; 
            opacity: 0;
            transition: top 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        /* 4. 3D Paper Rip Curtain */
        .paper-curtain {
            position: absolute;
            top: -110%; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 30;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform-origin: top center;
            transform: rotateX(-10deg) scale(1.02);
            transition: top 0.7s cubic-bezier(0.77, 0, 0.175, 1), transform 0.7s ease;
            clip-path: polygon(
                0% 0%, 100% 0%, 100% 95%, 
                95% 98%, 90% 94%, 85% 99%, 80% 95%, 75% 98%, 70% 93%, 65% 99%, 60% 94%, 
                55% 98%, 50% 95%, 45% 99%, 40% 94%, 35% 98%, 30% 95%, 25% 99%, 20% 94%, 
                15% 98%, 10% 95%, 5% 99%, 0% 94%
            );
        }
        .paper-curtain.drop { 
            top: 0%; 
            transform: rotateX(0deg) scale(1);
        }
        .paper-curtain.lift { 
            top: 110%; 
            transform: rotateX(10deg) scale(0.98);
        }

        .start-chat-btn {
            background: #ffffff; color: #000000; border: none; padding: 14px 40px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 10px;
        }
        .start-chat-btn:hover { background: #e0e0e0; transform: scale(1.04); }
        .version-label { font-size: 11px; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px; }

        /* Chat Layout */
        .chat-overlay { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .chat-stream { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 950px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
        
        .center-greeting-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; text-align: center; gap: 12px; color: #ffffff; font-size: 32px; font-weight: 500; padding: 40px 0;
        }

        .message { display: flex; gap: 14px; max-width: 100%; width: 100%; }
        .message.user { flex-direction: row-reverse; align-self: flex-end; }
        .message.ai { justify-content: flex-start; align-self: flex-start; }
        
        .message-avatar { width: 32px; height: 32px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
        .message.ai .message-content { color: var(--text-primary); font-size: 15px; line-height: 1.6; width: 100%; word-break: break-word; }
        .message.user .message-content { background-color: var(--surface-hover); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 18px 18px 4px 18px; font-size: 15px; word-break: break-word; max-width: 75%; }

        .input-area { padding: 16px 24px 20px 24px; max-width: 950px; width: 100%; margin: 0 auto; flex-shrink: 0; background: var(--bg-color); }
        .input-box-wrapper { background-color: #111111; border-radius: 28px; padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #activeInput { background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; width: 100%; min-height: 24px; max-height: 120px; }
        
        .send-btn { background-color: #fff; color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; flex-shrink: 0; }
        .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
        footer { text-align: center; padding: 4px; color: var(--text-secondary); font-size: 11px; }

        /* Map View Container */
        #mapView { flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-left">
                    <div class="brand-logo-icon">V</div>
                    <span>Vikea AI</span>
                </div>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                New chat
            </button>

            <div class="sidebar-section-title">Navigation & Tools</div>
            <div class="sidebar-nav">
                <button class="nav-item active-mode" id="navChat" onclick="switchView('chat')">
                    <span class="material-symbols-outlined">forum</span>
                    AI Assistant
                </button>
                <button class="nav-item" id="navMap" onclick="switchView('map')">
                    <span class="material-symbols-outlined">map</span>
                    Vikea Maps Alpha
                </button>
            </div>

            <div class="sidebar-section-title">Engine & Moods</div>
            <div class="sidebar-nav">
                <button class="nav-item" id="navUniversal" onclick="switchEngineMode('universal')">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Multi-Universal Core
                </button>
                <button class="nav-item" id="navCells" onclick="switchEngineMode('cells')">
                    <span class="material-symbols-outlined">biotech</span>
                    GCSE Cell Biology
                </button>
                <button class="nav-item" id="navPeriodic" onclick="switchEngineMode('science')">
                    <span class="material-symbols-outlined">science</span>
                    AQA Periodic Table & Atoms
                </button>
                <button class="nav-item" id="navCoder" onclick="switchEngineMode('coder')">
                    <span class="material-symbols-outlined">terminal</span>
                    Elite Coder Mode
                </button>
                <button class="nav-item" id="navRoast" onclick="switchEngineMode('roast')">
                    <span class="material-symbols-outlined">local_fire_department</span>
                    Savage Roast Mode 🔥
                </button>
                <button class="nav-item" id="navPhilosopher" onclick="switchEngineMode('philosopher')">
                    <span class="material-symbols-outlined">psychology</span>
                    Deep Philosopher
                </button>
            </div>
        </div>
        <div class="sidebar-bottom">
            <div class="user-profile-row" onclick="changeUserName()" title="Click to change name" style="display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; background-color:var(--surface-hover); border:1px solid var(--border-color); cursor:pointer;">
                <div class="user-avatar" id="userAvatarLetter" style="width:32px; height:32px; background-color:#fff; color:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">W</div>
                <div class="user-info" id="userNameLabel" style="font-size:13px; color:var(--text-primary);">Wahaj</div>
            </div>
        </div>
    </aside>

    <div class="main-container">
        <!-- Welcome Entrance Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="paper-curtain" id="paperCurtain"></div>
            <div></div>
            <div class="welcome-content" id="welcomeContent">
                <span class="title-left" id="titleLeft">VIKEA</span>
                <div class="orbit-container" id="welcomeOrbit">
                    <div class="orbit-ring" id="welcomeRing">
                        <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>
                        <div class="dot d5"></div><div class="dot d6"></div><div class="dot d7"></div><div class="dot d8"></div>
                    </div>
                    <div class="orbit-center-v" id="orbitCenterV">V</div>
                </div>
                <span class="title-right" id="titleRight">AI</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; z-index: 26;">
                <button class="start-chat-btn" onclick="startChatTransition()">Get Started / Chat</button>
                <div class="version-label">Version Alpha • Smart Engine</div>
            </div>
        </div>

        <!-- Chat View Section -->
        <div class="view-section active-view" id="chatView">
            <header>
                <span id="headerTitle">Vikea AI Assistant</span>
                <div class="model-badge-header" id="modelBadgeHeader">
                    <span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">bolt</span>
                    Universal Engine Active
                </div>
            </header>
            <div class="chat-overlay">
                <div class="chat-stream" id="chatStream">
                    <div class="center-greeting-box" id="centerGreetingBox">
                        <h1 id="randomGreetingText">What's the vibe today?</h1>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-box-wrapper">
                        <textarea id="activeInput" placeholder="Ask Vikea AI anything..." rows="1" onkeydown="handleKey(event)"></textarea>
                        <div class="prompt-toolbar" style="display:flex; justify-content:flex-end; border:none; padding-top:0;">
                            <button class="send-btn" onclick="sendFromActiveArea()">
                                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                    <footer>Made with Vikea Alpha © 2026</footer>
                </div>
            </div>
        </div>

        <!-- Map View Section -->
        <div class="view-section" id="mapViewSection">
            <header>
                <span>Vikea Maps Alpha</span>
                <div class="model-badge-header">
                    <span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">map</span>
                    OpenStreetMap Engine
                </div>
            </header>
            <div id="mapView"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentUserName = "Wahaj";
        let currentMode = "universal";
        let mapInitialized = false;
        let map;

        const vibes = [
            "What's the vibe today?",
            "What are we building?",
            "Ready when you are, Wahaj.",
            "Feed me some queries.",
            "Let's cook something up."
        ];

        function getRandomVibe() {
            return vibes[Math.floor(Math.random() * vibes.length)];
        }

        // Set random greeting on load
        document.getElementById('randomGreetingText').innerText = getRandomVibe();

        function switchView(viewName) {
            const welcome = document.getElementById('welcomeScreen');
            if (welcome && welcome.style.display !== 'none') {
                welcome.style.display = 'none';
            }

            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => el.classList.remove('active-mode'));

            if (viewName === 'chat') {
                document.getElementById('chatView').classList.add('active-view');
                document.getElementById('navChat').classList.add('active-mode');
            } else if (viewName === 'map') {
                document.getElementById('mapViewSection').classList.add('active-view');
                document.getElementById('navMap').classList.add('active-mode');
                
                setTimeout(() => {
                    if (!mapInitialized) {
                        map = L.map('mapView').setView([51.505, -0.09], 13);
                        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19,
                            attribution: '&copy; OpenStreetMap contributors'
                        }).addTo(map);
                        L.marker([51.505, -0.09]).addTo(map).bindPopup("<b>Vikea HQ is here!</b>").openPopup();
                        mapInitialized = true;
                    } else {
                        map.invalidateSize();
                    }
                }, 100);
            }
        }

        function startChatTransition() {
            const welcome = document.getElementById('welcomeScreen');
            const titleLeft = document.getElementById('titleLeft');
            const titleRight = document.getElementById('titleRight');
            const orbit = document.getElementById('welcomeOrbit');
            const curtain = document.getElementById('paperCurtain');

            // Step 1: First 2s fade out VIKEA to Left and AI to Right
            titleLeft.classList.add('fade-left');
            titleRight.classList.add('fade-right');

            // Step 2: Contract dots inside V and intense star shake
            setTimeout(() => {
                orbit.classList.add('stage-shake');
            }, 600);

            // Step 3: Dots stop orbiting, fight & attack the V until it dies
            setTimeout(() => {
                orbit.classList.remove('stage-shake');
                orbit.classList.add('stage-attack');
                setTimeout(() => {
                    orbit.classList.add('stage-kill-v');
                }, 400);
            }, 1200);

            // Step 4: Dots shoot up to the ceiling
            setTimeout(() => {
                orbit.classList.add('stage-ceiling');
            }, 1800);

            // Step 5: Pull 3D ripped paper curtain down from ceiling and uncover chat
            setTimeout(() => {
                curtain.classList.add('drop');
            }, 2100);

            setTimeout(() => {
                welcome.style.display = 'none';
                curtain.classList.remove('drop');
                curtain.classList.add('lift');
                document.getElementById('activeInput').focus();
            }, 2700);
        }

        function startNewChat() {
            switchView('chat');
            const stream = document.getElementById('chatStream');
            if (stream) {
                stream.innerHTML = `
                    <div class="center-greeting-box" id="centerGreetingBox">
                        <h1>${getRandomVibe()}</h1>
                    </div>
                `;
            }
            const input = document.getElementById('activeInput');
            if (input) {
                input.value = '';
                input.focus();
            }
        }

        function changeUserName() {
            const newName = prompt("Enter your new name:", currentUserName);
            if (newName && newName.trim() !== "") {
                currentUserName = newName.trim();
                document.getElementById('userNameLabel').innerText = currentUserName;
                document.getElementById('userAvatarLetter').innerText = currentUserName.charAt(0).toUpperCase();
            }
        }

        function switchEngineMode(mode) {
            switchView('chat');
            currentMode = mode;
            
            const badge = document.getElementById('modelBadgeHeader');
            const greetingBox = document.getElementById('centerGreetingBox');
            if (greetingBox) greetingBox.remove(); 

            const stream = document.getElementById('chatStream');
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';

            if (mode === 'universal') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">bolt</span> Universal Engine Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Switched to <strong>Multi-Universal Core</strong>. Ready for anything!</div>';
            } else if (mode === 'cells') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">biotech</span> GCSE Cell Biology Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Switched to <strong>GCSE Cell Biology</strong> mode. Hit me with organelle questions!</div>';
            } else if (mode === 'science') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">science</span> AQA Periodic Table Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Switched to <strong>AQA Periodic Table & Atoms</strong> mode. Let\'s study chemistry!</div>';
            } else if (mode === 'coder') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">terminal</span> Elite Coder Mode Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Elite Coder mode online. Let\'s write clean code.</div>';
            } else if (mode === 'roast') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">local_fire_department</span> Savage Roast Mode Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Roast mode active. Don\'t cry when I cook you, ' + currentUserName + '. What\'s up?</div>';
            } else if (mode === 'philosopher') {
                badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 14px; color: #fff;">psychology</span> Deep Philosopher Active';
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">Welcome to Deep Philosopher mode. Let us contemplate the universe.</div>';
            }
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendFromActiveArea();
            }
        }

        function sendFromActiveArea() {
            const input = document.getElementById('activeInput');
            const text = input.value.trim();
            if (!text) return;
            
            const greetingBox = document.getElementById('centerGreetingBox');
            if (greetingBox) greetingBox.remove();

            input.value = '';
            processUserQuery(text);
        }

        function processUserQuery(query) {
            const stream = document.getElementById('chatStream');
            const userInitial = currentUserName.charAt(0).toUpperCase();

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = '<div class="message-avatar">' + userInitial + '</div><div class="message-content">' + escapeHtml(query) + '</div>';
            stream.appendChild(userMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content" style="color: var(--text-secondary);">Thinking...</div>';
            stream.appendChild(aiMsgDiv);
            stream.scrollTop = stream.scrollHeight;

            setTimeout(() => {
                let responseText = generateSmartAnswer(query, currentMode);
                aiMsgDiv.innerHTML = '<div class="message-avatar">V</div><div class="message-content">' + formatMarkdown(responseText) + '</div>';
                stream.scrollTop = stream.scrollHeight;
            }, 600);
        }

        function generateSmartAnswer(query, mode) {
            const q = query.toLowerCase();

            if (q.includes('who is your owner') || q.includes('who made you') || q.includes('owner')) {
                return "I'm really glad that Wahaj made me! It took him months and now I'm ready to destroy the knowledge that this universe has indeed with my owner (Wahaj's) help!";
            }

            if (mode === 'cells') {
                if (q.includes('mitochondria')) return "Mitochondria are known as the **powerhouse of the cell**. They release energy through aerobic respiration.";
                return "In **GCSE Cell Biology**, regarding \"" + query + "\": Remember that animal and plant cells share key structures like the cell membrane, cytoplasm, and nucleus.";
            }
            if (mode === 'science') return "In **AQA Chemistry** regarding \"" + query + "\": Elements in the periodic table are arranged by atomic number.";
            if (mode === 'coder') return "For your coding query (\"" + query + "\"), make sure to check your syntax and structure your layout correctly.";
            if (mode === 'roast') return "Bruh, you're asking \"" + query + "\" like it's gonna solve your life problems. Let's be real! 🔥";
            if (mode === 'philosopher') return "To ponder \"" + query + "\" is to gaze into the vast mirror of existence.";

            if (q.includes('hello') || q.includes('hi')) return "Hello " + currentUserName + "! How can I help you build or explore today with Vikea Alpha?";
            return "That's an interesting question about \"" + query + "\". Vikea Alpha's Multi-Universal Core is tracking this query.";
        }

        function formatMarkdown(text) {
            return escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*(?!\*)/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
