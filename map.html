<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikea AI & Maps Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --surface-color: #111111;
            --surface-hover: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        html, body { 
            background-color: #000000; 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        /* Fullscreen Overlay - Completely Hides Sidebar & Header */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
            z-index: 999999;
            overflow: hidden;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #welcomeScreen.pull-down-reveal {
            transform: translateY(100vh);
        }

        .welcome-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: auto;
            margin-bottom: auto;
            position: relative;
        }

        .title-left, .title-right { 
            font-size: 64px; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: #ffffff; 
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: inline-block;
        }

        .title-left.fade-left {
            opacity: 0;
            transform: translateX(-250px);
        }
        .title-right.fade-right {
            opacity: 0;
            transform: translateX(250px);
        }

        .orbit-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Center V - LOCKED UPRIGHT */
        .orbit-center-v {
            width: 54px;
            height: 54px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 5;
            position: absolute;
            top: 28px;
            left: 28px;
            transform: none !important;
            transition: background 0.3s ease, opacity 0.4s ease, box-shadow 0.3s ease;
        }

        /* Dots Ring Layer */
        .dots-ring-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            animation: spinDotsRing 4s linear infinite;
        }

        .orbit-container.stop-spinning .dots-ring-layer {
            animation-play-state: paused !important;
        }

        @keyframes spinDotsRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dot { 
            position: absolute; 
            width: 7px; 
            height: 7px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #ffffff; 
            transition: all 0.4s ease;
        }

        .d1 { top: 2px; left: 51px; } .d2 { top: 16px; left: 83px; } .d3 { top: 51px; left: 101px; } .d4 { top: 85px; left: 83px; }
        .d5 { top: 100px; left: 51px; } .d6 { top: 85px; left: 18px; } .d7 { top: 51px; left: 0px; } .d8 { top: 16px; left: 18px; }

        /* Inward Dot Contraction & Star Pulse Shake */
        .stage-og-contract .dot { 
            top: 51px !important; 
            left: 51px !important; 
        }
        .stage-og-contract .orbit-center-v { 
            animation: vStarShakePulse 0.08s infinite alternate !important; 
            background: #ffffff;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ffffff, 0 0 90px #ffffff;
        }

        @keyframes vStarShakePulse {
            0% { transform: translate(-3px, -3px) scale(1) !important; }
            100% { transform: translate(3px, 3px) scale(1.25) !important; }
        }

        .floor-line {
            position: absolute;
            bottom: -30px;
            left: -200px;
            right: -200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .stage-battle-march .floor-line { opacity: 1; }

        .stage-battle-march .dots-ring-layer { animation: none !important; transform: none !important; }
        .stage-battle-march .dot {
            top: 90px !important;
            animation: swordStab 0.4s infinite alternate ease-in-out;
        }
